<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Pomodoro Timer</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="clock-container">
    <h2>Current Time</h2>
    <div class="current-time">{{ currentTime }}</div>
  </div>

  <div class="timer-container">
    <div class="timer-display">
      <span class="timer-text">{{ minutes }}:{{ seconds }}</span>
      <div class="timer-label">
        <span *ngIf="isRunning && !isBreak">Work Session</span>
        <span *ngIf="isRunning && isBreak">Break Time</span>
        <span *ngIf="!isRunning">Ready</span>
      </div>
    </div>

    <div class="button-container">
      <ion-button 
        expand="block" 
        size="large" 
        color="success"
        [disabled]="isRunning"
        (click)="startPomodoroSession()">
        Start Pomodoro
      </ion-button>

      <ion-button 
        expand="block" 
        size="large" 
        color="danger"
        [disabled]="!isRunning"
        (click)="resetTimer()">
        Reset
      </ion-button>
    </div>
  </div>

  <div class="info-container" *ngIf="!isRunning">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Pomodoro Technique</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>1. Work for 25 minutes</p>
        <p>2. Take a 5-minute break</p>
        <p>3. Repeat the cycle</p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
